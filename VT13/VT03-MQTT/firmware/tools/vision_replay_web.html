<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自瞄视觉回放</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #09121b; color: #e9f3f7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 12% 0, #163047, #09121b 52%); }
    .shell { max-width: 1480px; margin: auto; padding: 30px clamp(16px, 3vw, 48px); }
    header { display: flex; justify-content: space-between; gap: 18px; align-items: start; margin-bottom: 24px; }
    .eyebrow { color: #61d8de; font-size: 12px; font-weight: 700; letter-spacing: .18em; }
    h1 { margin: 6px 0; font-size: clamp(28px, 4vw, 44px); line-height: 1.1; }
    p { color: #93a9b8; margin: 8px 0; }
    .badge { padding: 9px 13px; border: 1px solid #deab55; border-radius: 999px; color: #f4cb8e; font-size: 12px; white-space: nowrap; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 18px; }
    .panel { border: 1px solid #233a4b; border-radius: 18px; background: #10202d; overflow: hidden; }
    .viewer { padding: 14px; }
    .stage { position: relative; background: #04090e; border-radius: 10px; overflow: hidden; display: grid; place-items: center; min-height: 300px; }
    canvas { display: block; max-width: 100%; max-height: 68vh; width: auto; height: auto; }
    .crosshair { position: absolute; inset: 0; pointer-events: none; }
    .crosshair::before, .crosshair::after { content: ''; position: absolute; background: #d9f6f340; }
    .crosshair::before { width: 1px; height: 32px; left: 50%; top: calc(50% - 16px); }
    .crosshair::after { height: 1px; width: 32px; top: 50%; left: calc(50% - 16px); }
    .controls { display: flex; gap: 14px; align-items: center; padding: 17px 3px 3px; }
    button { cursor: pointer; color: #06212a; background: #62d5d4; border: 0; border-radius: 9px; padding: 10px 17px; font-weight: 700; }
    input[type=range] { flex: 1; accent-color: #62d5d4; }
    .counter { font-variant-numeric: tabular-nums; font-size: 13px; color: #abc4ce; white-space: nowrap; }
    aside { padding: 23px; }
    h2 { font-size: 15px; letter-spacing: .04em; margin: 0 0 18px; }
    .metric { border-top: 1px solid #284050; padding: 15px 0; }
    .label { color: #8eabb9; font-size: 12px; }
    .value { font-size: 23px; font-weight: 700; margin-top: 5px; font-variant-numeric: tabular-nums; }
    .note { margin-top: 22px; border-left: 3px solid #dba95e; padding: 4px 0 4px 12px; font-size: 13px; line-height: 1.6; color: #c3d3d9; }
    .file { margin-top: 20px; color: #8eabb9; font-size: 12px; overflow-wrap: anywhere; }
    @media (max-width: 850px) { .layout { grid-template-columns: 1fr; } header { flex-wrap: wrap; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div><div class="eyebrow">NYU VISION · DIAGNOSTICS</div><h1>自瞄视觉回放</h1>
        <p>逐帧查看相机画面、模型候选框与画面中心。箭头键可切换帧。</p></div>
      <div class="badge">离线回放 · 未经人工标注验证</div>
    </header>
    <div class="layout">
      <section class="panel viewer" aria-label="视觉画面">
        <div class="stage"><canvas id="view"></canvas><div class="crosshair"></div></div>
        <div class="controls"><button id="play" type="button">播放</button>
          <input id="seek" type="range" min="0" max="0" value="0" aria-label="选择帧">
          <span id="counter" class="counter">— / —</span></div>
      </section>
      <aside class="panel">
        <h2>当前帧</h2>
        <div class="metric"><div class="label">候选装甲板</div><div id="count" class="value">—</div></div>
        <div class="metric"><div class="label">最高置信度</div><div id="confidence" class="value">—</div></div>
        <div class="metric"><div class="label">候选中心相对画面中心</div><div id="offset" class="value">—</div></div>
        <div class="metric"><div class="label">C 板控制 / 命中结果</div><div class="value">无数据</div></div>
        <div class="note">彩色框来自模型预测，不代表标注真值。中心偏移单位为图像百分比，不能直接当作云台角度、板上跟踪误差或命中率。</div>
        <div id="filename" class="file"></div>
      </aside>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('view');
    const context = canvas.getContext('2d');
    const seek = document.getElementById('seek');
    const play = document.getElementById('play');
    let frames = [], index = 0, timer = null, sequence = 0;

    function stop() { if (timer) clearInterval(timer); timer = null; play.textContent = '播放'; }
    function show(next) {
      if (!frames.length) return;
      index = (next + frames.length) % frames.length;
      const requested = ++sequence;
      const frame = frames[index];
      seek.value = index;
      document.getElementById('counter').textContent = `${index + 1} / ${frames.length}`;
      document.getElementById('filename').textContent = frame.name;
      document.getElementById('count').textContent = frame.boxes.length;
      const best = frame.boxes.reduce((a, b) => !a || b.confidence > a.confidence ? b : a, null);
      document.getElementById('confidence').textContent = best ? `${(best.confidence * 100).toFixed(1)}%` : '—';
      document.getElementById('offset').textContent = best ?
        `${(((best.rect[0] + best.rect[2]) / 2 - .5) * 100).toFixed(1)}%, ${(((best.rect[1] + best.rect[3]) / 2 - .5) * 100).toFixed(1)}%` : '—';
      const image = new Image();
      image.onload = () => {
        if (requested !== sequence) return;
        canvas.width = image.naturalWidth; canvas.height = image.naturalHeight;
        context.drawImage(image, 0, 0);
        frame.boxes.forEach((box, n) => {
          const [x1, y1, x2, y2] = box.rect;
          context.strokeStyle = n === 0 ? '#62e4dd' : '#ffbf6c';
          context.lineWidth = Math.max(2, canvas.width / 500);
          context.strokeRect(x1 * canvas.width, y1 * canvas.height,
            (x2 - x1) * canvas.width, (y2 - y1) * canvas.height);
          context.fillStyle = context.strokeStyle;
          context.font = `bold ${Math.max(16, canvas.width / 45)}px system-ui`;
          context.fillText(`${(box.confidence * 100).toFixed(0)}%`, x1 * canvas.width,
            Math.max(20, y1 * canvas.height - 6));
        });
      };
      image.src = `/frames/${index}`;
    }
    seek.addEventListener('input', () => show(Number(seek.value)));
    play.addEventListener('click', () => {
      if (timer) { stop(); return; }
      timer = setInterval(() => show(index + 1), 800);
      play.textContent = '暂停';
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowRight') { stop(); show(index + 1); }
      if (event.key === 'ArrowLeft') { stop(); show(index - 1); }
    });
    fetch('/api/session').then(response => response.json()).then(session => {
      frames = session.frames;
      seek.max = String(frames.length - 1);
      show(0);
    }).catch(error => { document.getElementById('filename').textContent = `加载失败：${error}`; });
  </script>
</body>
</html>

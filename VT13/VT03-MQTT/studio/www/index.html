<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双手柄 VR · 可视化编辑器</title><link rel="stylesheet" href="/style.css"><script src="/shared.js" defer></script><script src="/editor.js" defer></script></head><body>
<header><div><b>双手柄 VR 工作台</b><small>右手平移 · 左手旋转 · 独立程序</small></div><span class="badge" id="output-badge">车辆控制：未启用</span></header>
<main><section class="preview"><div class="toolbar"><button id="save">保存并同步到头显</button><button id="reload">重新载入布局</button><button id="add">添加组件</button><a href="/vr" target="_blank" rel="noopener">打开 VR 页面</a></div><p id="message" role="status">拖动组件；拖动选中组件右下角可调整大小。</p><canvas id="preview" width="960" height="600" aria-label="布局编辑画布"></canvas><p>头显浏览器地址：<strong>http://127.0.0.1:18780/vr</strong>（USB 转发启动后）。在头显内点击 Enter VR。</p><div class="telemetry"><article><h3>左手柄</h3><pre id="left">等待头显</pre></article><article><h3>右手柄</h3><pre id="right">等待头显</pre></article></div><p id="health">等待状态</p></section>
<aside><h2>组件属性</h2><label>选择组件<select id="widget"></select></label><label>类型<select id="type"><option value="label">文字面板</option><option value="status">手柄状态</option><option value="button">UI 测试按钮</option></select></label><label>文字<input id="text" maxlength="180"></label><label>底色<input id="color" type="color"></label><label>数据绑定<select id="binding"><option value="none">无</option><option value="left">左手柄</option><option value="right">右手柄</option></select></label><div class="fields"><label>X<input id="x" type="number" min="0" max="900"></label><label>Y<input id="y" type="number" min="0" max="560"></label><label>宽<input id="w" type="number" min="60" max="960"></label><label>高<input id="h" type="number" min="40" max="600"></label></div><button id="delete" class="secondary">删除选中组件</button><p>按钮只记录 UI 点击，不绑定底盘、机械臂或其他执行机构。</p><p>双手位置采用 WebXR 地面坐标、米、右手系；旋转为四元数 x/y/z/w。与 FrankaBot 原校准独立。</p></aside></main></body></html>
